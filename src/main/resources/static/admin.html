<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="智能导诊后台管理 - 医院知识与数据导入">
    <meta name="theme-color" content="#0d9488">
    <title>管理后台 · Intelligent Doctor Admin</title>
    <link rel="stylesheet" href="/styles.css?v=20260608">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="admin-body">

<!-- Toast Container -->
<div class="toast-container" id="toastContainer" aria-live="polite"></div>

<main class="admin-console">
    <aside class="admin-nav">
        <div class="admin-brand">
            <span class="admin-logo">医</span>
            <div>
                <strong>医院管理后台</strong>
                <small>Intelligent Doctor</small>
            </div>
        </div>
        <nav>
            <button class="nav-item active" data-view="overview">总览</button>
            <button class="nav-item" data-view="imports">数据导入</button>
            <button class="nav-item" data-view="catalog">医院数据</button>
            <button class="nav-item" data-view="consultations">问诊记录</button>
            <button class="nav-item" data-view="orders">挂号订单</button>
            <button class="nav-item" data-view="users">终端账号</button>
        </nav>
        <div class="admin-nav-footer">
            <a href="/" class="admin-link">返回导诊端</a>
            <button id="logoutAdminBtn" class="ghost-btn">退出后台</button>
        </div>
    </aside>

    <section class="admin-main">
        <header class="admin-topbar">
            <div>
                <div class="eyebrow">Hospital Operations</div>
                <h1 id="viewTitle">总览</h1>
            </div>
            <button id="refreshAllBtn" class="tiny-btn">刷新数据</button>
        </header>

        <section class="admin-view active" data-view-panel="overview">
            <div id="overviewMetrics" class="metric-grid"></div>
            <div class="admin-grid">
                <article class="admin-card">
                    <h2>系统配置</h2>
                    <div id="systemProfile" class="status-box">加载中...</div>
                </article>
                <article class="admin-card">
                    <h2>最近问诊</h2>
                    <div id="recentSessions" class="list-wrap"></div>
                </article>
            </div>
        </section>

        <section class="admin-view" data-view-panel="imports">
            <div class="admin-grid">
                <article class="admin-card">
                    <h2>上传医院数据</h2>
                    <p>支持 CSV / Excel / Markdown / PDF。CSV 和 Excel 可导入医院、科室、诊室、医生、排班、挂号规则和知识片段。</p>
                    <form id="uploadForm" class="upload-form">
                        <input type="file" id="uploadFile" accept=".csv,.xlsx,.xls,.md,.markdown,.pdf,.txt" required>
                        <button type="submit">上传并导入</button>
                    </form>
                    <div style="margin-top:10px">
                        <button id="reindexBtn" class="ghost-btn">重建向量索引</button>
                    </div>
                    <div id="importFeedback" class="status-box">等待操作</div>
                </article>
                <article class="admin-card">
                    <div class="card-head">
                        <h2>导入任务</h2>
                        <button id="refreshImports" class="tiny-btn">刷新</button>
                    </div>
                    <div id="importList" class="list-wrap"></div>
                </article>
            </div>
        </section>

        <section class="admin-view" data-view-panel="catalog">
            <div class="data-tabs">
                <button class="data-tab active" data-catalog-tab="departments">科室</button>
                <button class="data-tab" data-catalog-tab="doctors">医师</button>
                <button class="data-tab" data-catalog-tab="schedules">排班</button>
            </div>
            <div id="catalogTable" class="data-table-wrap"></div>
        </section>

        <section class="admin-view" data-view-panel="consultations">
            <div class="split-pane">
                <article class="admin-card">
                    <div class="card-head">
                        <h2>问诊会话</h2>
                        <button id="refreshSessions" class="tiny-btn">刷新</button>
                    </div>
                    <div id="sessionList" class="list-wrap tall"></div>
                </article>
                <article class="admin-card">
                    <h2>消息明细与汇总</h2>
                    <div id="sessionSummary" class="status-box">请选择左侧问诊记录</div>
                    <div id="messageList" class="message-audit"></div>
                </article>
            </div>
        </section>

        <section class="admin-view" data-view-panel="orders">
            <article class="admin-card">
                <div class="card-head">
                    <h2>挂号订单</h2>
                    <button id="refreshOrders" class="tiny-btn">刷新</button>
                </div>
                <div id="orderList" class="data-table-wrap"></div>
            </article>
        </section>

        <section class="admin-view" data-view-panel="users">
            <article class="admin-card">
                <div class="card-head">
                    <h2>导诊终端账号</h2>
                    <button id="refreshUsers" class="tiny-btn">刷新</button>
                </div>
                <p>访问智能导诊界面前必须使用终端账号登录。建议一台机器一个账号，如 machine-01、frontdesk-02。</p>
                <form id="userForm" class="admin-user-form">
                    <input type="text" id="newUsername" placeholder="终端账号，如 machine-01" autocomplete="off" required>
                    <input type="password" id="newPassword" placeholder="初始密码，至少 8 位" autocomplete="new-password" required>
                    <button type="submit">新增终端账号</button>
                </form>
                <div id="userFeedback" class="status-box">等待操作</div>
                <div id="userList" class="list-wrap"></div>
            </article>
        </section>
    </section>
</main>

<script src="/config.js?v=20260608"></script>
<script src="/admin.js?v=20260608"></script>
</body>
</html>
